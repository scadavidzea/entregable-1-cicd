name: Mi primer workflow - Entregable 1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imprimir_info:  # No cambies este nombre, lo usaremos para evaluar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7  # Este paso clona tu repositorio. No lo modifiques.

      - name: Imprimir Mensaje Personalizado
        shell: bash
        run: |
          echo "Hola, soy Samuel Cadavid Zapata y este es mi primer workflow!"
          echo "La fecha y hora actual es: $(date)"

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Ejecutar script Python
        run: python mi_script.py
